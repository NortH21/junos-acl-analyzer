# Шаблон секрета с токеном для чтения репозитория фильтров.
# Настоящий токен в git не коммитьте: создайте секрет командой
#   kubectl create secret generic jcore-filters-git --from-literal=token=<токен>
# или через вашу систему управления секретами.
apiVersion: v1
kind: Secret
metadata:
  name: jcore-filters-git
type: Opaque
stringData:
  token: <токен только на чтение>
