name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - '*.go'
      - '**/*.html'
      - 'Dockerfile'
  create:
    tags:
      - 'v*'

env:
  IMAGE: north21/junos-acl-analyzer
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/junos-acl-analyzer
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up QEMU (для сборки ARM64)
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ startsWith(github.ref, 'refs/tags/') && format('{0}:{1}', env.IMAGE, github.ref_name) || '' }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('{0}:{1}', env.GHCR_IMAGE, github.ref_name) || '' }}
